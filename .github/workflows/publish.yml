name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Prerelease versions publish under the `dev` dist-tag; stable → `latest`.
      # Trusted Publishing (OIDC) — no token; the bootstrap NPM_TOKEN was revoked.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=dev; else TAG=latest; fi
          echo "Publishing $VERSION under dist-tag '$TAG'"
          npx -y npm@latest publish --provenance --access public --tag "$TAG"
